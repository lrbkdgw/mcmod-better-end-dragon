# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

## Environment Properties

# The Minecraft version this mod targets.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# NeoForge for Minecraft 1.20.1 (the "compatibility period" fork, published as net.neoforged:forge)
neo_version=1.20.1-47.1.106
# The mod is loaded by the "forge" mod container on NeoForge 1.20.1 as well.
forge_version_range=[47,)
loader_version_range=[47,)

## Mod Properties

mod_id=betterenddragon
mod_name=Better End Dragon
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.lrbkdgw.betterenddragon
mod_authors=lrbkdgw
mod_description=Adds four special end crystals, a massively empowered two-phase Ender Dragon, and the Netherworld dimension.
